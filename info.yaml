
# Tiny Tapeout project information

project:
  title: "Fixed-Point Digital PID Controller"
  author: "Alfredo-Namigtle"
  discord: ""
  description: "Fixed-point digital PID controller using Tustin discretization"
  language: "Verilog"

  # IMPORTANT:
  # The PID coefficients were calculated for Ts = 200 us.
  # Therefore the PID update frequency must be 5000 Hz.
  # Confirm the actual clock supplied by Tiny Tapeout
  # before finalizing this value.
  clock_hz: 50000000

  tiles: "1x1"

  top_module: "tt_um_pid_controller"

  source_files:
    - "project.v"
    - "pid_fixed.v"

pinout:
  # Reference ADC: ui_in[7:0]
  ui[0]: "REF_ADC0"
  ui[1]: "REF_ADC1"
  ui[2]: "REF_ADC2"
  ui[3]: "REF_ADC3"
  ui[4]: "REF_ADC4"
  ui[5]: "REF_ADC5"
  ui[6]: "REF_ADC6"
  ui[7]: "REF_ADC7"

  # DAC output: uo_out[7:0]
  uo[0]: "DAC0"
  uo[1]: "DAC1"
  uo[2]: "DAC2"
  uo[3]: "DAC3"
  uo[4]: "DAC4"
  uo[5]: "DAC5"
  uo[6]: "DAC6"
  uo[7]: "DAC7"

  # Feedback ADC: uio_in[7:0]
  uio[0]: "FB_ADC0"
  uio[1]: "FB_ADC1"
  uio[2]: "FB_ADC2"
  uio[3]: "FB_ADC3"
  uio[4]: "FB_ADC4"
  uio[5]: "FB_ADC5"
  uio[6]: "FB_ADC6"
  uio[7]: "FB_ADC7"

yaml_version: 6
