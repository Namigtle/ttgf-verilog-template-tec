
name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  # ==========================================
  # VIEWER BUILD
  # ==========================================

  viewer_build:
    needs: gds
    runs-on: ubuntu-24.04

    steps:
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_submission

      - name: Set PDK
        shell: bash
        run: |
          echo "PDK=gf180mcuD" >> "$GITHUB_ENV"

      - name: Download GDS render
        uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: gh-pages

      - name: Copy GDS and OASIS files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for GDS files ==="
          find tt_submission -type f -iname "*.gds" -print

          echo "=== Searching for OASIS files ==="
          find tt_submission -type f -iname "*.oas" -print

          mapfile -t GDS_FILES < <(find tt_submission -type f -iname "*.gds" | sort)
          mapfile -t OAS_FILES < <(find tt_submission -type f -iname "*.oas" | sort)

          if [ "${#GDS_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No GDS file found."
            exit 1
          fi

          if [ "${#OAS_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No OASIS file found."
            exit 1
          fi

          mkdir -p gh-pages

          cp "${GDS_FILES[0]}" gh-pages/tinytapeout.gds
          cp "${OAS_FILES[0]}" gh-pages/tinytapeout.oas

          echo "=== Files copied successfully ==="
          ls -lh gh-pages/tinytapeout.*

      - name: Generate viewer redirect
        shell: bash
        run: |
          cat << EOF > gh-pages/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tiny Tapeout 3D Viewer</title>
          </head>
          <body>
            <script>
              location.href = "https://gds-viewer.tinytapeout.com/?pdk=${PDK}&model=" + encodeURIComponent(location.href + '/tinytapeout.oas');
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages
          name: github-pages-${{ github.run_attempt }}

  # ==========================================
  # VIEWER DEPLOY
  # ==========================================

  viewer_deploy:
    needs: viewer_build
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
